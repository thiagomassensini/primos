name: Publish v0.60.0 explicit finite G_pre sources and raw preservation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-v0.60.0.yml
      - docs/RELEASE_0.60.0.md
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.60.0.yml
      - docs/RELEASE_0.60.0.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.60.0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-bundle:
    name: Verify active integration and immutable mirror
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify publication source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "${CHECKED_OUT_SHA}" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "${REMOTE_MAIN_SHA}"

      - name: Static audit
        run: bash scripts/static_audit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=2,<3" "scipy>=1.14,<2"

      - name: Run real-rotation regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            experiments/test_c2_real_rotation_operator.py \
            experiments/test_c2_real_rotation_minimal.py \
            experiments/test_cp_branch_tilt_operator.py \
            2>&1 | tee python-release-tests.log

      - name: Set up Lean and mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate with Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail 2>&1 | tee lean-release-build.log

      - name: Prepare or verify annotated release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: v0.60.0
          TITLE: "CPFormal v0.60.0 — Fontes G_pre finitas explicitas e preservacao raw completa"
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "${GITHUB_SHA}" "${REMOTE_MAIN_SHA}"

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"
            TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"

            if [[ "${TAG_COMMIT}" = "${GITHUB_SHA}" ]]; then
              :
            elif git merge-base --is-ancestor "${TAG_COMMIT}" "${GITHUB_SHA}"; then
              while IFS= read -r path; do
                case "${path}" in
                  .github/workflows/release-v0.60.0.yml)
                    ;;
                  *)
                    echo "Unexpected post-tag change: ${path}" >&2
                    exit 1
                    ;;
                esac
              done < <(git diff --name-only "${TAG_COMMIT}" "${GITHUB_SHA}")
            else
              echo "Existing ${TAG} does not belong to this audited lineage." >&2
              exit 1
            fi
          else
            test "${REMOTE_MAIN_SHA}" = "${GITHUB_SHA}"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TITLE}"

            if ! git push origin "refs/tags/${TAG}"; then
              git tag -d "${TAG}"
              git fetch --force origin \
                "+refs/tags/${TAG}:refs/tags/${TAG}"
              test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"
              test "$(git rev-parse "${TAG}^{commit}")" = "${GITHUB_SHA}"
            fi
          fi

      - name: Fetch every branch, tag, and pull-request head
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --prune origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/tags/*:refs/tags/*" \
            "+refs/pull/*/head:refs/pull/*/head"

          while read -r ref sha; do
            name="${ref#refs/remotes/origin/}"
            if [[ "${name}" == "HEAD" ]]; then
              continue
            fi
            git update-ref "refs/heads/${name}" "${sha}"
          done < <(
            git for-each-ref \
              --format='%(refname) %(objectname)' \
              refs/remotes/origin/
          )

          git symbolic-ref HEAD refs/heads/main

          BRANCH_COUNT="$(git for-each-ref refs/heads/ | wc -l | tr -d ' ')"
          TAG_COUNT="$(git for-each-ref refs/tags/ | wc -l | tr -d ' ')"
          PR_COUNT="$(git for-each-ref refs/pull/ | wc -l | tr -d ' ')"

          {
            echo "branch_count=${BRANCH_COUNT}"
            echo "tag_count=${TAG_COUNT}"
            echo "pull_request_head_count=${PR_COUNT}"
          } | tee preservation-counts.txt

          if (( BRANCH_COUNT < 60 )); then
            echo "Expected at least 60 branch refs; found ${BRANCH_COUNT}." >&2
            exit 1
          fi
          if (( TAG_COUNT < 15 )); then
            echo "Expected at least 15 tag refs; found ${TAG_COUNT}." >&2
            exit 1
          fi
          if (( PR_COUNT < 42 )); then
            echo "Expected at least 42 pull-request head refs; found ${PR_COUNT}." >&2
            exit 1
          fi

      - name: Build, restore, and verify complete Git bundle
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="primos-complete-v0.60.0"
          BUNDLE="${PREFIX}.bundle"
          REFS="${PREFIX}-refs.txt"
          HEADS="${PREFIX}-heads.txt"
          VERIFY="${PREFIX}-verify.txt"
          RESTORE="${PREFIX}-RESTORE.txt"
          CHECKSUMS="${PREFIX}-SHA256SUMS.txt"

          git for-each-ref \
            --format='%(refname) %(objectname) %(objecttype)' \
            refs/heads/ refs/tags/ refs/pull/ \
            | LC_ALL=C sort > "${REFS}"

          if [[ "${GITHUB_EVENT_NAME}" = "push" && \
                "${GITHUB_REF}" = "refs/heads/main" ]]; then
            TAG_OBJECT="$(git rev-parse refs/tags/v0.60.0)"
            grep -Fxq \
              "refs/tags/v0.60.0 ${TAG_OBJECT} tag" \
              "${REFS}"
          fi

          mapfile -t BUNDLE_REFS < <(
            git for-each-ref \
              --format='%(refname)' \
              refs/heads/ refs/tags/ refs/pull/ \
              | LC_ALL=C sort
          )

          if (( ${#BUNDLE_REFS[@]} == 0 )); then
            echo "No refs available for bundle creation." >&2
            exit 1
          fi

          git bundle create "${BUNDLE}" "${BUNDLE_REFS[@]}"
          git bundle list-heads "${BUNDLE}" > "${HEADS}"
          git bundle verify "${BUNDLE}" > "${VERIFY}" 2>&1

          RESTORED="${RUNNER_TEMP}/primos-v0.60.0-restored.git"
          rm -rf "${RESTORED}"
          git clone --mirror "${BUNDLE}" "${RESTORED}" >> "${VERIFY}" 2>&1
          git -C "${RESTORED}" fsck --full --strict >> "${VERIFY}" 2>&1

          git -C "${RESTORED}" for-each-ref \
            --format='%(refname) %(objectname) %(objecttype)' \
            refs/heads/ refs/tags/ refs/pull/ \
            | LC_ALL=C sort > restored-refs.txt

          diff -u "${REFS}" restored-refs.txt >> "${VERIFY}"
          cat preservation-counts.txt >> "${VERIFY}"

          cat > "${RESTORE}" <<'EOF'
          Complete recovery instructions
          ==============================

          1. Verify all cryptographic checksums:

             sha256sum -c primos-complete-v0.60.0-SHA256SUMS.txt

          2. Restore a complete bare mirror:

             git clone --mirror primos-complete-v0.60.0.bundle primos-restored.git
             git -C primos-restored.git fsck --full --strict

          3. Create a normal working copy:

             git clone primos-restored.git primos-working-copy

          The ref manifest records the exact SHA of every bundled branch, tag,
          and pull-request head at publication time.
          EOF

          sha256sum \
            "${BUNDLE}" \
            "${REFS}" \
            "${HEADS}" \
            "${VERIFY}" \
            "${RESTORE}" \
            > "${CHECKSUMS}"

          sha256sum -c "${CHECKSUMS}"

      - name: Upload preservation artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: primos-complete-v0.60.0
          path: |
            primos-complete-v0.60.0.bundle
            primos-complete-v0.60.0-refs.txt
            primos-complete-v0.60.0-heads.txt
            primos-complete-v0.60.0-verify.txt
            primos-complete-v0.60.0-RESTORE.txt
            primos-complete-v0.60.0-SHA256SUMS.txt
            python-release-tests.log
            lean-release-build.log
          if-no-files-found: error
          retention-days: 90

      - name: Publish release and verify exact assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.60.0
          TITLE: "CPFormal v0.60.0 — Fontes G_pre finitas explicitas e preservacao raw completa"
        shell: bash
        run: |
          set -euo pipefail

          ASSETS=(
            primos-complete-v0.60.0.bundle
            primos-complete-v0.60.0-refs.txt
            primos-complete-v0.60.0-heads.txt
            primos-complete-v0.60.0-verify.txt
            primos-complete-v0.60.0-RESTORE.txt
            primos-complete-v0.60.0-SHA256SUMS.txt
          )

          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor "${TAG_COMMIT}" "${GITHUB_SHA}"

          TAG_OBJECT="$(git rev-parse "refs/tags/${TAG}")"
          grep -Fxq \
            "refs/tags/${TAG} ${TAG_OBJECT} tag" \
            primos-complete-v0.60.0-refs.txt

          RELEASE_EXISTS=false
          IMMUTABLE=false
          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            IMMUTABLE="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                --jq '.immutable // false'
            )"
          fi

          if [[ "${RELEASE_EXISTS}" = "true" && \
                "${IMMUTABLE}" = "true" ]]; then
            echo "Existing release is immutable; validating without mutation."
          else
            if [[ "${RELEASE_EXISTS}" = "true" ]]; then
              gh release edit "${TAG}" \
                --title "${TITLE}" \
                --notes-file docs/RELEASE_0.60.0.md \
                --latest
            else
              gh release create "${TAG}" \
                --verify-tag \
                --draft \
                --title "${TITLE}" \
                --notes-file docs/RELEASE_0.60.0.md
            fi

            gh release upload "${TAG}" "${ASSETS[@]}" --clobber

            DOWNLOAD_DIR="$(
              mktemp -d "${RUNNER_TEMP}/v060-assets.XXXXXX"
            )"
            gh release download "${TAG}" --dir "${DOWNLOAD_DIR}"
            for asset in "${ASSETS[@]}"; do
              cmp -- "${asset}" "${DOWNLOAD_DIR}/${asset}"
            done
            (
              cd "${DOWNLOAD_DIR}"
              sha256sum -c primos-complete-v0.60.0-SHA256SUMS.txt
            )

            RELEASE_STATE="$(
              gh release view "${TAG}" \
                --json isDraft,isPrerelease \
                --jq '[.isDraft, .isPrerelease] | join(" ")'
            )"
            if [[ "${RELEASE_STATE}" != "false false" ]]; then
              gh release edit "${TAG}" \
                --draft=false \
                --prerelease=false \
                --latest
            fi
          fi

          printf '%s\n' "${ASSETS[@]}" | LC_ALL=C sort \
            > expected-release-assets.txt
          gh release view "${TAG}" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort \
            > actual-release-assets.txt
          diff -u expected-release-assets.txt actual-release-assets.txt

          RELEASE_STATE="$(
            gh release view "${TAG}" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | join(" ")'
          )"
          test "${RELEASE_STATE}" = "false false"

          ACTUAL_TITLE="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.name'
          )"
          test "${ACTUAL_TITLE}" = "${TITLE}"
          # `gh api --jq` terminates its textual output with a newline even
          # when the JSON string itself has none.  Decode the raw JSON body
          # with `jq -rj` so this remains a genuinely byte-exact comparison.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -rj '.body' > actual-release-body.md
          cmp -- docs/RELEASE_0.60.0.md actual-release-body.md

          IMMUTABLE="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq '.immutable // false'
          )"
          if [[ "${IMMUTABLE}" = "true" ]]; then
            gh release verify "${TAG}"
            for asset in "${ASSETS[@]}"; do
              gh release verify-asset "${TAG}" "${asset}"
            done
          else
            DOWNLOAD_DIR="$(
              mktemp -d "${RUNNER_TEMP}/v060-final-assets.XXXXXX"
            )"
            gh release download "${TAG}" --dir "${DOWNLOAD_DIR}"
            for asset in "${ASSETS[@]}"; do
              cmp -- "${asset}" "${DOWNLOAD_DIR}/${asset}"
            done
            (
              cd "${DOWNLOAD_DIR}"
              sha256sum -c primos-complete-v0.60.0-SHA256SUMS.txt
            )
          fi

      - name: Preserve validation failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v0.60.0-failure-logs-${{ github.run_id }}
          path: |
            preservation-counts.txt
            python-release-tests.log
            lean-release-build.log
            primos-complete-v0.60.0-verify.txt
          if-no-files-found: ignore
          retention-days: 30
