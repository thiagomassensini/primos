name: Verify v0.56.0 preservation

on:
  push:
    branches:
      - ops/verify-v0.56.0-preservation
    paths:
      - .github/workflows/verify-v0.56.0-preservation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout operational verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GitHub release and poll Zenodo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops

          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "thiagomassensini/primos"
          tag = "v0.56.0"
          expected_sha = "2738672df336eaec71f6504b51207557e4c4271d"
          concept_doi = "10.5281/zenodo.21483474"

          def get_json(url, headers=None):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "CPFormal-preservation-verifier/1.0",
                      "Accept": "application/json",
                      **(headers or {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)

          release_url = (
              f"https://api.github.com/repos/{repository}/releases/tags/{tag}"
          )
          release = get_json(
              release_url,
              {
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          if release.get("tag_name") != tag:
              raise SystemExit("GitHub release tag mismatch")
          if release.get("draft") is not False:
              raise SystemExit("GitHub release is still a draft")
          if release.get("prerelease") is not False:
              raise SystemExit("GitHub release is marked prerelease")

          tag_ref = get_json(
              f"https://api.github.com/repos/{repository}/git/ref/tags/{tag}",
              {
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          tag_object_url = tag_ref.get("object", {}).get("url")
          if not tag_object_url:
              raise SystemExit("Annotated tag object URL is missing")
          tag_object = get_json(
              tag_object_url,
              {
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          tag_commit_sha = tag_object.get("object", {}).get("sha")
          if tag_commit_sha != expected_sha:
              raise SystemExit(
                  f"Annotated tag resolves to {tag_commit_sha}, expected {expected_sha}"
              )

          zenodo_endpoint = "https://zenodo.org/api/records"
          queries = [
              '"CPFormal v0.56.0"',
              '"Complete research-history preservation"',
              '"thiagomassensini/primos" AND "0.56.0"',
              f'conceptdoi:"{concept_doi}"',
          ]
          selected = None
          observations = []

          def is_target(record):
              metadata = record.get("metadata", {}) or {}
              related = metadata.get("related_identifiers", []) or []
              related_text = " ".join(
                  str(item.get("identifier", "")) for item in related
              )
              text = " ".join(
                  [
                      str(metadata.get("title", "")),
                      str(metadata.get("description", "")),
                      str(metadata.get("version", "")),
                      str(record.get("conceptdoi", "")),
                      str(metadata.get("conceptdoi", "")),
                      related_text,
                  ]
              ).lower()
              has_version = (
                  "v0.56.0" in text
                  or "0.56.0" == str(metadata.get("version", "")).lower()
                  or "0.56.0" in str(metadata.get("version", "")).lower()
              )
              has_repo = (
                  "thiagomassensini/primos" in text
                  or "cpformal" in text
                  or concept_doi.lower() in text
              )
              return has_version and has_repo

          for attempt in range(1, 31):
              records = []
              for query in queries:
                  url = zenodo_endpoint + "?" + urllib.parse.urlencode(
                      {"q": query, "size": 25, "sort": "mostrecent"}
                  )
                  try:
                      payload = get_json(url)
                      hits = payload.get("hits", {}).get("hits", [])
                      observations.append(
                          {
                              "attempt": attempt,
                              "query": query,
                              "hit_count": len(hits),
                          }
                      )
                      records.extend(hits)
                  except Exception as exc:
                      observations.append(
                          {
                              "attempt": attempt,
                              "query": query,
                              "error": f"{type(exc).__name__}: {exc}",
                          }
                      )

              seen = set()
              for record in records:
                  record_id = str(record.get("id", ""))
                  if not record_id or record_id in seen:
                      continue
                  seen.add(record_id)
                  if is_target(record):
                      selected = record
                      break

              if selected is not None:
                  break
              time.sleep(20)

          if selected is None:
              with open(
                  "ops/v0.56.0-preservation-pending.json", "w", encoding="utf-8"
              ) as handle:
                  json.dump(
                      {
                          "status": "zenodo_pending",
                          "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
                          "repository": repository,
                          "tag": tag,
                          "release_id": release.get("id"),
                          "release_url": release.get("html_url"),
                          "observations": observations,
                      },
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")
              raise SystemExit("Zenodo v0.56.0 record was not found within polling window")

          metadata = selected.get("metadata", {}) or {}
          links = selected.get("links", {}) or {}
          proof = {
              "status": "confirmed",
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "repository": repository,
              "tag": tag,
              "tag_commit_sha": tag_commit_sha,
              "github_release": {
                  "id": release.get("id"),
                  "url": release.get("html_url"),
                  "name": release.get("name"),
                  "draft": release.get("draft"),
                  "prerelease": release.get("prerelease"),
                  "published_at": release.get("published_at"),
              },
              "zenodo": {
                  "record_id": selected.get("id"),
                  "doi": selected.get("doi") or metadata.get("doi"),
                  "conceptdoi": selected.get("conceptdoi")
                      or metadata.get("conceptdoi"),
                  "title": metadata.get("title"),
                  "version": metadata.get("version"),
                  "created": selected.get("created"),
                  "updated": selected.get("updated"),
                  "record_url": links.get("html") or links.get("self_html"),
                  "files": [
                      {
                          "key": item.get("key"),
                          "size": item.get("size"),
                          "checksum": item.get("checksum"),
                      }
                      for item in (selected.get("files", []) or [])
                  ],
              },
              "observations": observations,
          }

          if proof["zenodo"]["conceptdoi"] != concept_doi:
              raise SystemExit(
                  f"Zenodo concept DOI mismatch: {proof['zenodo']['conceptdoi']}"
              )
          if not proof["zenodo"]["doi"]:
              raise SystemExit("Zenodo version DOI is missing")

          with open(
              "ops/v0.56.0-preservation-confirmed.json", "w", encoding="utf-8"
          ) as handle:
              json.dump(proof, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Persist independent verification proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/v0.56.0-preservation-confirmed.json
          git commit -m "chore(archive): confirm v0.56.0 GitHub and Zenodo preservation"
          git push origin "HEAD:ops/verify-v0.56.0-preservation"
