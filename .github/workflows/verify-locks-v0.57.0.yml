name: Verify repository preservation locks

on:
  push:
    branches:
      - ops/verify-v0.57.0-complete-mirror
    paths:
      - .github/workflows/verify-locks-v0.57.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query GitHub preservation locks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          repo = "thiagomassensini/primos"
          token = os.environ["GH_TOKEN"]

          def get(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "CPFormal-lock-verifier/1.0",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          branch = get(f"https://api.github.com/repos/{repo}/branches/main")
          release = get(f"https://api.github.com/repos/{repo}/releases/tags/v0.57.0")

          output = {
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "repository": repo,
              "main": {
                  "sha": (branch.get("commit") or {}).get("sha"),
                  "protected": branch.get("protected"),
                  "protection_url": branch.get("protection_url"),
              },
              "release_v0_57_0": {
                  "id": release.get("id"),
                  "tag_name": release.get("tag_name"),
                  "draft": release.get("draft"),
                  "prerelease": release.get("prerelease"),
                  "immutable": release.get("immutable"),
                  "published_at": release.get("published_at"),
                  "asset_names": sorted(
                      a.get("name") for a in release.get("assets", []) if a.get("name")
                  ),
              },
          }

          if output["main"]["protected"] is not True:
              raise SystemExit("main is not protected")
          if output["release_v0_57_0"]["immutable"] is not True:
              raise SystemExit("v0.57.0 release is not immutable")
          if output["release_v0_57_0"]["draft"] is not False:
              raise SystemExit("v0.57.0 release is still draft")
          if output["release_v0_57_0"]["prerelease"] is not False:
              raise SystemExit("v0.57.0 release is prerelease")

          with open("ops/v0.57.0-locks-confirmed.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Persist lock proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/v0.57.0-locks-confirmed.json
          git commit -m "chore(archive): confirm branch and release locks"
          git push origin "HEAD:ops/verify-v0.57.0-complete-mirror"
