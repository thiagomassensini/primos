name: Verify v0.58.0 immutable complete mirror

on:
  push:
    branches:
      - ops/verify-v0.58.0-immutable-mirror
    paths:
      - .github/workflows/verify-v0.58.0-immutable-mirror.yml
  workflow_dispatch:

permissions:
  actions: read
  attestations: read
  contents: write

jobs:
  verify:
    name: Verify branch lock, immutable release, bundle, and Zenodo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify GitHub locks and download immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p github-assets zenodo-assets ops

          API_VERSION="2026-03-10"
          REPO="${GITHUB_REPOSITORY}"
          TAG="v0.58.0"

          gh api \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "repos/${REPO}/branches/main" \
            > ops/v0.58.0-main-branch.json

          gh api \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "repos/${REPO}/immutable-releases" \
            > ops/v0.58.0-immutable-setting.json

          gh api \
            -H "X-GitHub-Api-Version: ${API_VERSION}" \
            "repos/${REPO}/releases/tags/${TAG}" \
            > ops/v0.58.0-release.json

          jq -e '.protected == true' ops/v0.58.0-main-branch.json >/dev/null
          jq -e '.enabled == true' ops/v0.58.0-immutable-setting.json >/dev/null
          jq -e '.draft == false and .prerelease == false and .immutable == true' \
            ops/v0.58.0-release.json >/dev/null

          mapfile -t EXPECTED < <(printf '%s\n' \
            primos-complete-v0.58.0.bundle \
            primos-complete-v0.58.0-refs.txt \
            primos-complete-v0.58.0-heads.txt \
            primos-complete-v0.58.0-verify.txt \
            primos-complete-v0.58.0-RESTORE.txt \
            primos-complete-v0.58.0-SHA256SUMS.txt)

          for name in "${EXPECTED[@]}"; do
            asset_id="$(
              jq -r --arg name "${name}" \
                '.assets[] | select(.name == $name) | .id' \
                ops/v0.58.0-release.json
            )"
            if [[ -z "${asset_id}" || "${asset_id}" == "null" ]]; then
              echo "Missing immutable release asset: ${name}" >&2
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "repos/${REPO}/releases/assets/${asset_id}" \
              > "github-assets/${name}"
          done

          gh release verify "${TAG}" \
            | tee ops/v0.58.0-release-attestation-verify.txt

          for name in "${EXPECTED[@]}"; do
            gh release verify-asset "${TAG}" "github-assets/${name}" \
              | tee -a ops/v0.58.0-release-attestation-verify.txt
          done

      - name: Restore and verify complete Git mirror independently
        shell: bash
        run: |
          set -euo pipefail
          cd github-assets

          sha256sum -c primos-complete-v0.58.0-SHA256SUMS.txt \
            | tee ../ops/v0.58.0-checksums-verify.txt

          git bundle verify primos-complete-v0.58.0.bundle \
            2>&1 | tee ../ops/v0.58.0-bundle-verify.txt

          RESTORED="${RUNNER_TEMP}/primos-v0.58.0-independent.git"
          rm -rf "${RESTORED}"
          git clone --mirror \
            primos-complete-v0.58.0.bundle \
            "${RESTORED}" \
            2>&1 | tee -a ../ops/v0.58.0-bundle-verify.txt

          git -C "${RESTORED}" fsck --full --strict \
            2>&1 | tee -a ../ops/v0.58.0-bundle-verify.txt

          git -C "${RESTORED}" for-each-ref \
            --format='%(refname) %(objectname) %(objecttype)' \
            refs/heads/ refs/tags/ refs/pull/ \
            | LC_ALL=C sort > ../ops/v0.58.0-restored-refs.txt

          diff -u \
            primos-complete-v0.58.0-refs.txt \
            ../ops/v0.58.0-restored-refs.txt \
            | tee -a ../ops/v0.58.0-bundle-verify.txt

      - name: Poll Zenodo and compare every preservation asset
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          expected = {
              "primos-complete-v0.58.0.bundle",
              "primos-complete-v0.58.0-refs.txt",
              "primos-complete-v0.58.0-heads.txt",
              "primos-complete-v0.58.0-verify.txt",
              "primos-complete-v0.58.0-RESTORE.txt",
              "primos-complete-v0.58.0-SHA256SUMS.txt",
          }

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "CPFormal-v0.58.0-Zenodo-verifier/1.0"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def download(url, path):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "CPFormal-v0.58.0-Zenodo-verifier/1.0"},
              )
              with urllib.request.urlopen(req, timeout=180) as response:
                  pathlib.Path(path).write_bytes(response.read())

          selected = None
          observations = []
          queries = [
              '"CPFormal v0.58.0"',
              '"Immutable complete Git mirror"',
              'conceptdoi:"10.5281/zenodo.21483474"',
          ]

          for attempt in range(1, 91):
              hits = []
              for q in queries:
                  url = "https://zenodo.org/api/records?" + urllib.parse.urlencode({
                      "q": q,
                      "size": 25,
                      "sort": "mostrecent",
                  })
                  try:
                      payload = get_json(url)
                      found = payload.get("hits", {}).get("hits", [])
                      hits.extend(found)
                      observations.append({
                          "attempt": attempt,
                          "query": q,
                          "hit_count": len(found),
                      })
                  except Exception as exc:
                      observations.append({
                          "attempt": attempt,
                          "query": q,
                          "error": f"{type(exc).__name__}: {exc}",
                      })

              seen = set()
              for record in hits:
                  rid = str(record.get("id", ""))
                  if rid in seen:
                      continue
                  seen.add(rid)
                  metadata = record.get("metadata", {}) or {}
                  version = str(metadata.get("version", ""))
                  title = str(metadata.get("title", ""))
                  files = {f.get("key") for f in record.get("files", [])}
                  if (version == "v0.58.0" or "v0.58.0" in title) and expected.issubset(files):
                      selected = record
                      break
              if selected is not None:
                  break
              time.sleep(10)

          if selected is None:
              raise SystemExit("Zenodo did not ingest the complete v0.58.0 asset set")

          zenodo_files = []
          for item in selected.get("files", []):
              key = item.get("key")
              if key not in expected:
                  continue
              links = item.get("links", {}) or {}
              url = links.get("self") or links.get("download")
              if not url:
                  raise SystemExit(f"No Zenodo download URL for {key}")
              target = pathlib.Path("zenodo-assets") / key
              download(url, target)
              data = target.read_bytes()
              zenodo_files.append({
                  "name": key,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "zenodo_checksum": item.get("checksum"),
              })

          github_files = []
          for key in sorted(expected):
              data = (pathlib.Path("github-assets") / key).read_bytes()
              github_files.append({
                  "name": key,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          gh = {x["name"]: x["sha256"] for x in github_files}
          ze = {x["name"]: x["sha256"] for x in zenodo_files}
          if gh != ze:
              raise SystemExit("GitHub immutable assets and Zenodo files differ")

          branch = json.loads(pathlib.Path("ops/v0.58.0-main-branch.json").read_text())
          setting = json.loads(pathlib.Path("ops/v0.58.0-immutable-setting.json").read_text())
          release = json.loads(pathlib.Path("ops/v0.58.0-release.json").read_text())
          metadata = selected.get("metadata", {}) or {}
          links = selected.get("links", {}) or {}

          proof = {
              "status": "immutable_complete_git_mirror_confirmed",
              "checked_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "repository": "thiagomassensini/primos",
              "main": {
                  "sha": (branch.get("commit") or {}).get("sha"),
                  "protected": branch.get("protected"),
              },
              "immutable_releases_setting": setting,
              "github_release": {
                  "id": release.get("id"),
                  "tag": release.get("tag_name"),
                  "draft": release.get("draft"),
                  "prerelease": release.get("prerelease"),
                  "immutable": release.get("immutable"),
                  "published_at": release.get("published_at"),
                  "html_url": release.get("html_url"),
                  "assets": github_files,
              },
              "zenodo": {
                  "record_id": selected.get("id"),
                  "doi": selected.get("doi") or metadata.get("doi"),
                  "conceptdoi": selected.get("conceptdoi") or metadata.get("conceptdoi"),
                  "title": metadata.get("title"),
                  "version": metadata.get("version"),
                  "record_url": links.get("html") or links.get("self_html"),
                  "created": selected.get("created"),
                  "updated": selected.get("updated"),
                  "files": sorted(zenodo_files, key=lambda x: x["name"]),
                  "observations": observations,
              },
          }

          pathlib.Path("ops/v0.58.0-immutable-mirror-confirmed.json").write_text(
              json.dumps(proof, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Persist independent proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/
          git commit -m \
            "chore(archive): confirm immutable v0.58.0 complete Git mirror"
          git push origin "HEAD:ops/verify-v0.58.0-immutable-mirror"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v0.58.0-immutable-preservation-proof
          path: ops/
          if-no-files-found: error
          retention-days: 90
