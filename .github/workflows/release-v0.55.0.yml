name: Publish v0.55.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.55.0.yml
      - docs/RELEASE_0.55.0.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.55.0
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify and publish v0.55.0
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main release ref
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"

          if [[ "${CHECKED_OUT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out HEAD does not match GITHUB_SHA." >&2
            exit 1
          fi

          if [[ "${REMOTE_MAIN_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "This run is not auditing the current remote main head." >&2
            exit 1
          fi

      - name: Static audit
        run: bash scripts/static_audit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical test dependency
        run: |
          python -m pip install --disable-pip-version-check "numpy>=2,<3" "scipy>=1.14,<2"

      - name: Test real-rotation empirical operators
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            experiments/test_c2_real_rotation_operator.py \
            experiments/test_c2_real_rotation_minimal.py \
            2>&1 | tee python-release-tests.log

      - name: Set up Lean and mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate with Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail 2>&1 | tee lean-release-build.log

      - name: Preserve validation failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-logs-${{ github.run_id }}
          path: |
            python-release-tests.log
            lean-release-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Create annotated tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.55.0
          TITLE: "CPFormal v0.55.0 — Universal carry structural persistence"
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/*:refs/tags/*"

          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "${REMOTE_MAIN_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Remote main moved after validation; refusing stale release." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            TAG_TYPE="$(git cat-file -t "refs/tags/${TAG}")"
            TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"

            if [[ "${TAG_TYPE}" != "tag" ]]; then
              echo "Existing ${TAG} is not an annotated tag." >&2
              exit 1
            fi

            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              if ! git merge-base --is-ancestor "${TAG_COMMIT}" "${GITHUB_SHA}"; then
                echo "Existing ${TAG} is not an ancestor of current main." >&2
                exit 1
              fi

              RELEASE_STATE="$(
                gh release view "${TAG}" \
                  --json isDraft,isPrerelease \
                  --jq '[.isDraft, .isPrerelease] | join(" ")'
              )"
              if [[ "${RELEASE_STATE}" != "false false" ]]; then
                echo "Historical ${TAG} release is draft or prerelease." >&2
                exit 1
              fi

              echo "Historical ${TAG} is intact at ancestor ${TAG_COMMIT}."
              exit 0
            fi

            echo "Tag ${TAG} already exists at the verified release commit."
          else
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TITLE}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_STATE="$(
              gh release view "${TAG}" \
                --json isDraft,isPrerelease \
                --jq '[.isDraft, .isPrerelease] | join(" ")'
            )"

            if [[ "${RELEASE_STATE}" != "false false" ]]; then
              echo "Existing ${TAG} release is draft or prerelease." >&2
              exit 1
            fi

            echo "Published release ${TAG} already exists; nothing to republish."
            exit 0
          fi

          gh release create "${TAG}" \
            --verify-tag \
            --title "${TITLE}" \
            --notes-file docs/RELEASE_0.55.0.md
