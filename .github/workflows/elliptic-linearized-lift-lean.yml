name: Elliptic finite arithmetic Lean gate

on:
  pull_request:
    paths:
      - "CPFormal/Elliptic/LinearizedLift.lean"
      - "CPFormal/Elliptic/ProductFiber.lean"
      - "CPFormal/Elliptic/ProductEnergy.lean"
      - "CPFormal/Elliptic/CoprimeState.lean"
      - "CPFormal/Elliptic/ReductionFiber.lean"
      - "CPFormal.lean"
      - ".github/workflows/elliptic-linearized-lift-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elliptic-finite:
    name: Kernel-check elliptic finite arithmetic layer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static audit
        run: bash scripts/static_audit.sh

      - name: Set up Lean and mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build the reduction-fiber module and its local dependencies
        shell: bash
        run: |
          set -o pipefail
          lake build --wfail CPFormal.Elliptic.ReductionFiber 2>&1 \
            | tee elliptic-finite.log

      - name: Preserve failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elliptic-finite-${{ github.run_id }}
          path: elliptic-finite.log
          if-no-files-found: ignore
          retention-days: 7
